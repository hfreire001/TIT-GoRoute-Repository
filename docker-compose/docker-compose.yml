version: '3.8'

services:
  # Contenedor de la Base de Datos (PostgreSQL + PostGIS)
  postgis_db:
    image: postgis/postgis:latest
    container_name: mi_postgis
    environment:
      - POSTGRES_USER=mi_usuario
      - POSTGRES_PASSWORD=mi_contraseña_segura
      - POSTGRES_DB=mi_base_gis
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./datos.sql:/docker-entrypoint-initdb.d/datos.sql:ro
    restart: unless-stopped

  # Contenedor de la Interfaz (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mi_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgis_db
    restart: unless-stopped

# Volumen para que los datos no se borren si apagas el contenedor
volumes:
  postgis_data: